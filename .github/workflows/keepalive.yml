name: Keep Supabase Awake
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        run: |
          BASE="https://dr-materials.vercel.app"
          ENDPOINT="/api/keepalive"
          curl -fsS "${BASE}${ENDPOINT}"
